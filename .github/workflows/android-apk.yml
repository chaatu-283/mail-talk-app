name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'app-20261025-v48.js'
      - 'app.css'
      - 'index.html'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'app-20261025-v48.js'
      - 'app.css'
      - 'index.html'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Web regression tests
        run: node --test tests/*.test.cjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Keep stable debug signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: mailtalk-debug-keystore-v1
          fail-on-cache-miss: true

      - name: Require registered signing key
        shell: bash
        run: |
          test -f "$HOME/.android/debug.keystore" || { echo 'Registered keystore is missing; never generate a replacement.'; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace
      - name: Signing fingerprint
        shell: bash
        env:
          LANG: C
          LC_ALL: C
        run: |
          echo "===== MAIL TALK KEYSTORE CERTIFICATE ====="
          keytool -list -v             -keystore "$HOME/.android/debug.keystore"             -alias androiddebugkey             -storepass android             -keypass android | grep -E "SHA1:|SHA256:" || true
          echo "==========================================="

      - name: Verify built APK identity
        shell: bash
        run: bash scripts/verify-apk.sh android/app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/MailTalk-v0.47-native-beta7-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MailTalk-debug-apk
          path: dist/MailTalk-v0.47-native-beta7-debug.apk
          if-no-files-found: error
