name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Keep stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mailtalk-debug-keystore-v1

      - name: Generate stable debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace
      - name: Signing fingerprint
        shell: bash
        env:
          LANG: C
          LC_ALL: C
        run: |
          echo "===== MAIL TALK ANDROID CERTIFICATE ====="
          keytool -list -v             -keystore "$HOME/.android/debug.keystore"             -alias androiddebugkey             -storepass android             -keypass android | grep -E "SHA1:|SHA256:" || true
          echo "PACKAGE: jp.chaatu.mailtalk"
          echo "========================================="
      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/MailTalk-v0.46-native-beta3-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MailTalk-debug-apk
          path: dist/MailTalk-v0.46-native-beta3-debug.apk
          if-no-files-found: error
