<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fc">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://gmail.googleapis.com https://www.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self';">
  <link rel="stylesheet" href="app.css">
  <title>メールトーク｜Gmail接続テスト</title>
</head>
<body>
<div class="app">
  <aside class="side">
    <header class="top">
      <div class="brand"><div><h1>メールトーク</h1><div class="status" id="statusText">Gmail 未接続</div></div><button class="secondary" id="syncBtn">↻ 同期</button></div>
      <div class="search"><input id="searchInput" type="search" placeholder="相手・件名・本文を検索"><button class="secondary" id="clearSearch">×</button></div>
    </header>
    <div class="filters" id="filters"></div>
    <div class="list" id="talkList"></div>
    <nav class="nav">
      <button data-tab="talks" class="active">💬 トーク</button>
      <button data-tab="settings">⚙ 設定</button>
    </nav>
  </aside>
  <main class="main" id="mainPane">
    <section class="empty">
      <h2>Gmailを、相手ごとの会話に。</h2>
      <p>同じ相手からのメールは、件名が変わっても1つのトークにまとめます。</p>
      <button class="primary" data-sync>Gmailを読み込む</button>
    </section>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="app.js" defer></script>
</body>
</html>
